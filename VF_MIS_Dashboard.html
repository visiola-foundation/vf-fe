<meta charset="utf-8">

<title>Visiola Foundation — Management Information System</title>
<style>
/* ── Brand tokens, sampled from the Foundation logo ───────────────── */
:root{
  --vf-blue:#00A3DA; --vf-green:#9EC83E; --vf-red:#D8232A;
  --vf-purple:#958EB8; --ink:#151314; --ink-2:#3D3B3C;
  --paper:#F5F7F4; --card:#FFFFFF; --line:#E2E6DF; --line-2:#CFD5CA;
  --muted:#6E7370;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink); font-family:var(--sans);
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
/* the hatch that stands for "we do not have this data" */
.hatch{
  background-image:repeating-linear-gradient(-45deg,
    var(--line-2) 0 1.5px, transparent 1.5px 6px);
}
h1,h2,h3{font-weight:700; letter-spacing:-.02em; margin:0}
.num{font-family:var(--mono); font-variant-numeric:tabular-nums}
a{color:var(--vf-blue)}
button{font-family:inherit; font-size:inherit}
:focus-visible{outline:2.5px solid var(--vf-blue); outline-offset:2px; border-radius:4px}

/* ── Shell ─────────────────────────────────────────────────────────── */
.top{
  display:flex; align-items:center; gap:16px; flex-wrap:wrap;
  padding:12px 20px; background:var(--card); border-bottom:1px solid var(--line);
  position:sticky; top:0; z-index:40;
}
.top img{height:38px; width:auto; display:block}
.top .spacer{flex:1}
.roleswitch{display:flex; gap:0; border:1px solid var(--line-2); border-radius:999px; overflow:hidden; background:var(--paper)}
.roleswitch button{
  border:0; background:transparent; padding:7px 15px; cursor:pointer;
  font-size:12.5px; font-weight:600; letter-spacing:.02em; color:var(--ink-2);
}
.roleswitch button[aria-pressed="true"]{background:var(--ink); color:#fff}
.stamp{font-family:var(--mono); font-size:11.5px; color:var(--muted)}

.wrap{display:flex; align-items:flex-start; gap:0; min-height:calc(100vh - 64px)}
nav.rail{
  width:230px; flex:0 0 230px; background:var(--ink); color:#fff;
  padding:18px 12px 40px; position:sticky; top:64px; height:calc(100vh - 64px);
  overflow-y:auto;
}
nav.rail .grouplabel{
  font-family:var(--mono); font-size:10px; letter-spacing:.14em;
  text-transform:uppercase; color:#7E8480; padding:14px 10px 6px;
}
nav.rail button{
  display:flex; justify-content:space-between; align-items:center; gap:8px;
  width:100%; text-align:left; border:0; background:transparent; color:#C9CEC8;
  padding:9px 10px; border-radius:8px; cursor:pointer; font-size:14px;
}
nav.rail button:hover:not(:disabled){background:#242122; color:#fff}
nav.rail button[aria-current="true"]{background:#fff; color:var(--ink); font-weight:650}
nav.rail button:disabled{opacity:.34; cursor:not-allowed}
nav.rail .lock{font-size:11px}
main{flex:1; padding:26px 30px 70px; min-width:0; max-width:1240px}

/* ── Type ──────────────────────────────────────────────────────────── */
.eyebrow{
  font-family:var(--mono); font-size:10.5px; letter-spacing:.16em;
  text-transform:uppercase; color:var(--muted); margin:0 0 6px
}
h1.page{font-size:26px; margin-bottom:4px}
.lede{color:var(--ink-2); max-width:68ch; margin:6px 0 22px}
h2.sec{font-size:15px; letter-spacing:0; margin:32px 0 12px; display:flex; align-items:center; gap:10px}
h2.sec::after{content:""; flex:1; height:1px; background:var(--line)}

/* ── Cards ─────────────────────────────────────────────────────────── */
.grid{display:grid; gap:14px}
.g4{grid-template-columns:repeat(auto-fit,minmax(215px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:16px}
.kpi .label{font-size:12px; color:var(--muted); font-weight:600; letter-spacing:.01em}
.kpi .val{font-family:var(--mono); font-size:33px; font-weight:600; letter-spacing:-.03em; line-height:1.15; margin-top:4px}
.kpi .sub{font-size:12px; color:var(--muted); margin-top:3px}
.kpi.accent-blue{border-left:3px solid var(--vf-blue)}
.kpi.accent-green{border-left:3px solid var(--vf-green)}
.kpi.accent-red{border-left:3px solid var(--vf-red)}
.kpi.accent-purple{border-left:3px solid var(--vf-purple)}

/* signature element: the fill gauge */
.gauge{height:7px; border-radius:4px; overflow:hidden; display:flex; margin-top:10px; border:1px solid var(--line)}
.gauge .have{background:var(--vf-green)}
.gauge .have.blue{background:var(--vf-blue)}
.gauge .missing{flex:1}
.gaugelabel{display:flex; justify-content:space-between; font-family:var(--mono); font-size:10.5px; color:var(--muted); margin-top:5px}

/* ── Notices ───────────────────────────────────────────────────────── */
.notice{border-radius:var(--r); padding:14px 16px; border:1px solid; font-size:13.5px; margin:0 0 18px}
.notice h3{font-size:13.5px; margin-bottom:5px}
.notice.err{background:#FDF2F2; border-color:#F0C4C4; color:#7A1A1F}
.notice.info{background:#F0F9FD; border-color:#BDE3F3; color:#0B4F68}
.notice.warn{background:#FBF8EE; border-color:#E6DCB8; color:#6B5A16}
.notice p{margin:5px 0 0}

/* ── Tables ────────────────────────────────────────────────────────── */
.tablewrap{overflow-x:auto; border:1px solid var(--line); border-radius:var(--r); background:var(--card)}
table{border-collapse:collapse; width:100%; font-size:13px}
th,td{padding:8px 11px; text-align:left; border-bottom:1px solid var(--line); white-space:nowrap}
th{
  font-family:var(--mono); font-size:10.5px; letter-spacing:.08em; text-transform:uppercase;
  color:var(--muted); background:var(--paper); position:sticky; top:0; font-weight:600
}
tbody tr:hover{background:#FAFBF9}
td.n{font-family:var(--mono); font-variant-numeric:tabular-nums; text-align:right}
.blank{display:inline-block; min-width:34px; height:12px; border-radius:3px; vertical-align:-2px}
.pill{display:inline-block; padding:2px 8px; border-radius:999px; font-size:11px; font-weight:650; font-family:var(--mono)}
.pill.ok{background:#EDF6DC; color:#4A6410}
.pill.amb{background:#FBF1DB; color:#7A5713}
.pill.no{background:#F7EAEA; color:#8A2027}
.pill.up{background:#EDF6DC; color:#4A6410}
.pill.down{background:#F7EAEA; color:#8A2027}
.pill.flat{background:#EDEFF2; color:#4A5057}

/* ── Controls ──────────────────────────────────────────────────────── */
.controls{display:flex; gap:9px; flex-wrap:wrap; align-items:center; margin-bottom:13px}
input[type=text],input[type=search],select,input[type=date],input[type=number]{
  font-family:inherit; font-size:13px; padding:7px 10px; border:1px solid var(--line-2);
  border-radius:7px; background:var(--card); color:var(--ink); min-width:0;
}
.btn{
  border:1px solid var(--line-2); background:var(--card); color:var(--ink);
  padding:7px 13px; border-radius:7px; cursor:pointer; font-size:13px; font-weight:600
}
.btn:hover{border-color:var(--ink); }
.btn.primary{background:var(--ink); color:#fff; border-color:var(--ink)}
.btn.primary:hover{background:#000}
.chip{
  border:1px solid var(--line-2); background:var(--card); padding:6px 12px;
  border-radius:999px; cursor:pointer; font-size:12.5px; font-weight:600; color:var(--ink-2)
}
.chip[aria-pressed="true"]{background:var(--ink); color:#fff; border-color:var(--ink)}

/* editable cells */
td.edit{cursor:text}
td.edit:focus{background:#FFFBEA; outline:2px solid var(--vf-blue); outline-offset:-2px}
td.dirty{box-shadow:inset 3px 0 0 var(--vf-green)}

/* ── Empty states ──────────────────────────────────────────────────── */
.empty{
  border:1px dashed var(--line-2); border-radius:var(--r); padding:26px;
  text-align:center; color:var(--muted); background:var(--card)
}
.empty strong{display:block; color:var(--ink); font-size:14px; margin-bottom:4px}

.legend{display:flex; gap:16px; flex-wrap:wrap; font-size:12px; color:var(--ink-2); margin-top:10px}
.legend i{display:inline-block; width:11px; height:11px; border-radius:3px; margin-right:5px; vertical-align:-1px}
.hidden{display:none !important}
.foot{margin-top:44px; padding-top:16px; border-top:1px solid var(--line); font-size:12px; color:var(--muted)}

@media (max-width:820px){
  .wrap{flex-direction:column}
  nav.rail{
    width:100%; flex:none; height:auto; position:static; display:flex;
    gap:6px; overflow-x:auto; padding:10px; white-space:nowrap
  }
  nav.rail .grouplabel{display:none}
  nav.rail button{width:auto; padding:8px 13px; font-size:13px}
  main{padding:18px 14px 60px}
  .top{padding:10px 14px}
  h1.page{font-size:21px}
}
@media (prefers-reduced-motion:reduce){*{animation:none !important; transition:none !important}}
</style>

<header class="top">

</header>

<div class="wrap">
  <nav class="rail" id="rail"></nav>
  <main id="main"></main>
</div>

let role = 'admin', page = 'overview';
const fmt = n => n === null || n === undefined || Number.isNaN(n) ? '—'
                : n.toLocaleString('en-US');
const pct = n => n === null || n === undefined ? '—' : n.toFixed(1) + '%';
const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* A blank is drawn as a hatch, never as a zero or a dash that could be
   mistaken for a real value of nothing. */
const blank = () => '<span class="blank hatch" title="No data recorded"></span>';
const cell  = v => (v === null || v === undefined || v === '') ? blank() : esc(v);

function gauge(filled, total, cls){
  const p = total ? (filled/total*100) : 0;
  return `<div class="gauge"><div class="have ${cls||''}" style="width:${p.toFixed(1)}%"></div>
    <div class="missing hatch"></div></div>`;
}
function kpi(label, val, sub, accent, g){

/* ── Hand-drawn SVG charts (no external libraries, works offline) ──── */
function barChart(rows, {key, series, height=210, colors, money=false}){
  const w = 720, pad = {l:44, r:12, t:14, b:34};
  const max = Math.max(...rows.flatMap(r => series.map(s => r[s.k] || 0))) || 1;
  const iw = w - pad.l - pad.r, ih = height - pad.t - pad.b;
  const bw = iw / rows.length, gw = bw * 0.62, sw = gw / series.length;
  let out = `<svg viewBox="0 0 ${w} ${height}" role="img" style="width:100%;height:auto">`;
  for (let i = 0; i <= 4; i++){
    const y = pad.t + ih - (ih * i / 4), v = Math.round(max * i / 4);
    out += `<line x1="${pad.l}" y1="${y}" x2="${w-pad.r}" y2="${y}" stroke="#E2E6DF"/>
      <text x="${pad.l-7}" y="${y+3.5}" text-anchor="end" font-size="10"
        font-family="ui-monospace,monospace" fill="#6E7370">${v}</text>`;
  }
  rows.forEach((r,i) => {
    series.forEach((s,j) => {
      const v = r[s.k] || 0, h = ih * v / max;
      const x = pad.l + i*bw + (bw-gw)/2 + j*sw;
      out += `<rect x="${x}" y="${pad.t+ih-h}" width="${sw-2.5}" height="${h}"
        fill="${s.c}" rx="2"><title>${esc(r[key])} · ${s.label}: ${v}</title></rect>`;
    });
    out += `<text x="${pad.l+i*bw+bw/2}" y="${height-11}" text-anchor="middle"
      font-size="10.5" font-family="ui-monospace,monospace" fill="#3D3B3C">${esc(r[key])}</text>`;
  });
  out += '</svg>';
  const leg = series.map(s =>
    `<span><i style="background:${s.c}"></i>${s.label}</span>`).join('');
  return out + `<div class="legend">${leg}</div>`;
}

function lineChart(pts, {height=210, lo, hi, labels}){
  const w = 720, pad = {l:44, r:16, t:16, b:32};
  const iw = w-pad.l-pad.r, ih = height-pad.t-pad.b;
  const x = i => pad.l + (pts.length===1?iw/2:iw*i/(pts.length-1));
  const y = v => pad.t + ih - ih*(v-lo)/(hi-lo);
  let out = `<svg viewBox="0 0 ${w} ${height}" role="img" style="width:100%;height:auto">`;
  for (let i=0;i<=4;i++){
    const gy = pad.t+ih-ih*i/4, gv = (lo+(hi-lo)*i/4).toFixed(1);
    out += `<line x1="${pad.l}" y1="${gy}" x2="${w-pad.r}" y2="${gy}" stroke="#E2E6DF"/>
      <text x="${pad.l-7}" y="${gy+3.5}" text-anchor="end" font-size="10"
        font-family="ui-monospace,monospace" fill="#6E7370">${gv}</text>`;
  }
  out += `<polyline fill="none" stroke="#00A3DA" stroke-width="2.5"
    stroke-linejoin="round" points="${pts.map((p,i)=>`${x(i)},${y(p)}`).join(' ')}"/>`;
  pts.forEach((p,i) => {
    out += `<circle cx="${x(i)}" cy="${y(p)}" r="5" fill="#fff" stroke="#00A3DA" stroke-width="2.5"/>
      <text x="${x(i)}" y="${y(p)-13}" text-anchor="middle" font-size="11.5" font-weight="650"
        font-family="ui-monospace,monospace" fill="#151314">${p.toFixed(2)}</text>
      <text x="${x(i)}" y="${height-10}" text-anchor="middle" font-size="10.5"
        font-family="ui-monospace,monospace" fill="#3D3B3C">${esc(labels[i])}</text>`;
  });
  return out + '</svg>';
}

function stackBar(segs, total){
  const parts = segs.filter(s => s.v > 0).map(s =>
    `<div style="width:${(s.v/total*100).toFixed(2)}%;background:${s.c}" title="${s.label}: ${s.v}"></div>`
  ).join('');
  return `<div style="display:flex;height:26px;border-radius:6px;overflow:hidden;border:1px solid var(--line)">${parts}</div>
  <div class="legend">${segs.map(s=>`<span><i style="background:${s.c}"></i>${s.label} <b class="num">${s.v}</b></span>`).join('')}</div>`;
}

/* Age is derived at read time, so it is right on whatever day this is opened. */
function ageOf(dob){
  if (!dob) return null;
  const d = new Date(dob); if (isNaN(d)) return null;
  const now = new Date();
  let a = now.getFullYear() - d.getFullYear();
  const m = now.getMonth() - d.getMonth();
  if (m < 0 || (m === 0 && now.getDate() < d.getDate())) a--;
  return (a < 0 || a > 100) ? null : a;
}

}

    ${kpi('Issues logged', `<span class="num">${fmt(T.issues)}</span>`, 'Across all three files', 'blue')}

const RENDER = {overview:pageOverview, reach:pageReach, ascg:pageAscg, cbc:pageCbc,
  prog3:pageProg3, register:pageRegister, quality:pageQuality, board:pageBoard,
  proposed:pageProposed};

/* ── Wiring ────────────────────────────────────────────────────────── */
function buildRail(){
  const allowed = ACCESS[role];
  let html = '', lastGroup = '';
  PAGES.forEach(p => {
    if (p.group !== lastGroup){ html += `<div class="grouplabel">${p.group}</div>`; lastGroup = p.group; }
    const ok = allowed.includes(p.id);
    html += `<button data-page="${p.id}" ${ok?'':'disabled'}
      aria-current="${page===p.id}" title="${ok?'':'Not available to this role'}">
      <span>${p.label}</span>${ok?'':'<span class="lock">🔒</span>'}</button>`;
  });
  document.getElementById('rail').innerHTML = html;
  document.querySelectorAll('#rail button').forEach(b =>
    b.onclick = () => { page = b.dataset.page; render(); });
}

function render(){
  if (!ACCESS[role].includes(page)) page = ACCESS[role][0];
  buildRail();
  const m = document.getElementById('main');
  m.innerHTML = RENDER[page]() + `<div class="foot">
    The Visiola Foundation · Management Information System ·
    Data loaded ${DATA.generated} · Signed in as
    <b>${role === 'admin' ? 'key staff' : role === 'staff' ? 'programme staff' : 'Board member'}</b>.
    Edits made here are held in this session only; export them to save.</div>`;
  m.scrollTop = 0;
  window.scrollTo(0, 0);
  if (page === 'register') wireRegister();
}

function wireRegister(){
  const q = document.getElementById('q');
  let tmr;
  q.oninput = e => { clearTimeout(tmr); const v = e.target.value;
    tmr = setTimeout(() => { filterText = v; render();
      const el = document.getElementById('q'); el.focus();
      el.setSelectionRange(el.value.length, el.value.length); }, 260); };
  document.getElementById('fschool').onchange = e => { filterSchool = e.target.value; render(); };
  document.getElementById('fmatch').onchange  = e => { filterMatch  = e.target.value; render(); };
  document.getElementById('fmissing').onclick = () => { filterMissing = !filterMissing; render(); };
  document.getElementById('addrow').onclick = () => {
    const n = roster.filter(r => r.uid.startsWith('VF-NEW')).length + 1;
    roster.unshift({uid:`VF-NEW-${String(n).padStart(4,'0')}`, match:'unmatched',
      first:null, last:null, dob:null, email:null, phone:null, school:null,
      father:null, mother:null, fatherEdu:null, fatherEmp:null, motherEdu:null,
      motherEmp:null, sis:null, bro:null, consent:null, fav:null, diff:null,
      car1:null, car2:null, t1:null, t2:null, t3:null, band:null});
    filterText = ''; render();
  };
  document.getElementById('export').onclick = exportCsv;

  document.querySelectorAll('td.edit').forEach(td => {
    td.addEventListener('focus', () => {
      if (td.querySelector('.blank')) td.textContent = '';
    });
    td.addEventListener('blur', () => {
      const uid = td.closest('tr').dataset.uid, k = td.dataset.k;
      const row = roster.find(r => r.uid === uid); if (!row) return;
      const v = td.textContent.trim();
      const nv = v === '' ? null : v;
      if (nv !== row[k]){ row[k] = nv; dirty.add(uid + '|' + k); td.classList.add('dirty'); }
      if (v === '') td.innerHTML = blank();
      if (k === 'dob'){
        const cells = td.closest('tr').children;
        cells[COLS.findIndex(c => c.k === 'age')].innerHTML = cell(ageOf(row.dob));
      }
    });
    td.addEventListener('keydown', e => {
      if (e.key === 'Enter'){ e.preventDefault(); td.blur(); }
      if (e.key === 'Escape'){ td.blur(); }
    });
  });
}

function exportCsv(){
  const keys = COLS.filter(c => !c.derived).map(c => c.k);
  const changed = new Set([...dirty].map(d => d.split('|')[0]));
  const rows = roster.filter(r => changed.has(r.uid));
  if (!rows.length){ alert('No edits to export yet. Change a cell first.'); return; }
  const esc2 = v => v === null || v === undefined ? ''
    : /[",\n]/.test(v) ? '"' + String(v).replace(/"/g,'""') + '"' : String(v);
  const csv = [keys.join(',') , ...rows.map(r => keys.map(k => esc2(r[k])).join(','))].join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv'}));
  a.download = 'vf_register_edits.csv';
  a.click(); URL.revokeObjectURL(a.href);
}

document.querySelectorAll('.roleswitch button').forEach(b =>
  b.onclick = () => {
    role = b.dataset.role;
    document.querySelectorAll('.roleswitch button').forEach(x =>
      x.setAttribute('aria-pressed', x === b));
    render();
  });

document.getElementById('stamp').textContent =
  new Date().toLocaleDateString('en-US', {year:'numeric', month:'short', day:'numeric'});
render();
</script>
